[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-any-llm"
version = "0.1.0"
description = "Wrap any instruct LLM into Jev-mode prediction (Choice / Noul / Score)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jev-any-llm" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
jev-any-llm-serve = "jev_any_llm.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_any_llm = ["playground.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
