<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800"
     font-family="Helvetica Neue,Arial,sans-serif">
<defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .badge-text { font-size: 11px; font-weight: 600; fill: #fff; }
    .node-title { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .node-text { font-size: 11.5px; fill: #475569; }
    .node-text-bold { font-size: 11.5px; font-weight: 600; fill: #1e293b; }
    .mono { font-size: 11.5px; fill: #334155; }
    .inv { font-size: 12.5px; font-weight: 600; fill: #1d4ed8; }
    .legend-text { font-size: 11px; fill: #475569; }
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 8" refX="9" refY="4"
          markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 Z" fill="#3b82f6"/>
  </marker>
  <marker id="arrow-gray" viewBox="0 0 10 8" refX="9" refY="4"
          markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="34" class="title">Wrap: any instruct LLM into Jev-mode</text>
<text x="40" y="54" class="subtitle">generate + option logprobs  &#xB7;  library post-processes Choice / Noul / Score  &#xB7;  the model predicts aliases</text>
<rect x="40" y="70" width="1020" height="132" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="56" y="84" width="108" height="24" rx="12" fill="#2563eb"/>
<text x="110.0" y="100" text-anchor="middle" class="badge-text">REQUEST</text>
<text x="176" y="101" class="node-text">Client.decide(state, questions)  &#xB7;  POST /v1/systemone</text>
<rect x="56" y="116" width="232" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
<rect x="56" y="116" width="232" height="26" rx="8" fill="#dbeafe"/>
<rect x="56" y="134" width="232" height="8" fill="#dbeafe"/>
<text x="172.0" y="135" text-anchor="middle" class="node-title" fill="#1d4ed8">state</text>
<text x="68" y="164" class="node-text">string / object / list</text>
<rect x="304" y="116" width="232" height="70" rx="8" fill="#fff" stroke="#86efac"/>
<rect x="304" y="116" width="232" height="26" rx="8" fill="#dcfce7"/>
<rect x="304" y="134" width="232" height="8" fill="#dcfce7"/>
<text x="420.0" y="135" text-anchor="middle" class="node-title" fill="#15803d">Noul</text>
<text x="316" y="164" class="node-text">Yes / No logprobs</text>
<rect x="552" y="116" width="232" height="70" rx="8" fill="#fff" stroke="#fcd34d"/>
<rect x="552" y="116" width="232" height="26" rx="8" fill="#fef3c7"/>
<rect x="552" y="134" width="232" height="8" fill="#fef3c7"/>
<text x="668.0" y="135" text-anchor="middle" class="node-title" fill="#b45309">Choice</text>
<text x="564" y="164" class="node-text">one alias per option</text>
<rect x="800" y="116" width="244" height="70" rx="8" fill="#fff" stroke="#c4b5fd"/>
<rect x="800" y="116" width="244" height="26" rx="8" fill="#f5f3ff"/>
<rect x="800" y="134" width="244" height="8" fill="#f5f3ff"/>
<text x="922.0" y="135" text-anchor="middle" class="node-title" fill="#6d28d9">Score</text>
<text x="812" y="164" class="node-text">one alias per level</text>
<line x1="550" y1="202" x2="550" y2="222" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="40" y="228" width="1020" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="550" y="256" text-anchor="middle" class="inv">Isolation: one generate per question. Prompt = state + that question only.</text>
<line x1="550" y1="272" x2="550" y2="292" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="40" y="298" width="1020" height="220" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<rect x="56" y="312" width="132" height="24" rx="12" fill="#d97706"/>
<text x="122.0" y="328" text-anchor="middle" class="badge-text">WRAP PATH</text>
<text x="200" y="329" class="node-text">Phase 1  &#xB7;  contract on any LLM</text>
<rect x="56" y="348" width="232" height="152" rx="8" fill="#fff" stroke="#93c5fd"/>
<rect x="56" y="348" width="232" height="26" rx="8" fill="#dbeafe"/>
<rect x="56" y="366" width="232" height="8" fill="#dbeafe"/>
<text x="172.0" y="367" text-anchor="middle" class="node-title" fill="#1d4ed8">1  Any instruct LLM</text>
<text x="68" y="396" class="node-text">Qwen / Llama / Mistral</text>
<text x="68" y="412" class="node-text">or OpenAI-compatible API</text>
<text x="68" y="428" class="node-text">Needs logprobs on generate</text>
<rect x="304" y="348" width="232" height="152" rx="8" fill="#fff" stroke="#fcd34d"/>
<rect x="304" y="348" width="232" height="26" rx="8" fill="#fef3c7"/>
<rect x="304" y="366" width="232" height="8" fill="#fef3c7"/>
<text x="420.0" y="367" text-anchor="middle" class="node-title" fill="#b45309">2  Prompt aliases</text>
<text x="316" y="396" class="node-text">A / B / C for Choice</text>
<text x="316" y="412" class="node-text">Yes / No for Noul</text>
<text x="316" y="428" class="node-text">0 .. K-1 for Score</text>
<rect x="552" y="348" width="232" height="152" rx="8" fill="#fff" stroke="#86efac"/>
<rect x="552" y="348" width="232" height="26" rx="8" fill="#dcfce7"/>
<rect x="552" y="366" width="232" height="8" fill="#dcfce7"/>
<text x="668.0" y="367" text-anchor="middle" class="node-title" fill="#15803d">3  Generate + logprob</text>
<text x="564" y="396" class="node-text">Usually one token</text>
<text x="564" y="412" class="node-text">Read alias logprobs</text>
<text x="564" y="428" class="node-text">Softmax the closed set</text>
<rect x="800" y="348" width="244" height="152" rx="8" fill="#fff" stroke="#c4b5fd"/>
<rect x="800" y="348" width="244" height="26" rx="8" fill="#f5f3ff"/>
<rect x="800" y="366" width="244" height="8" fill="#f5f3ff"/>
<text x="922.0" y="367" text-anchor="middle" class="node-title" fill="#6d28d9">4  library post-process</text>
<text x="812" y="396" class="node-text">Map aliases to option ids</text>
<text x="812" y="412" class="node-text">Fill noul / choice / score</text>
<text x="812" y="428" class="node-text">Confidence from entropy</text>
<line x1="288" y1="424" x2="300" y2="424" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="536" y1="424" x2="548" y2="424" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="784" y1="424" x2="796" y2="424" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="550" y1="518" x2="550" y2="538" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="40" y="544" width="1020" height="150" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="56" y="558" width="108" height="24" rx="12" fill="#334155"/>
<text x="110.0" y="574" text-anchor="middle" class="badge-text">ANSWERS</text>
<text x="176" y="575" class="node-text">Jev-shaped JSON assembled by the library. Confidence is logprob concentration.</text>
<rect x="56" y="590" width="320" height="88" rx="8" fill="#fff" stroke="#86efac"/>
<rect x="56" y="590" width="320" height="26" rx="8" fill="#dcfce7"/>
<rect x="56" y="608" width="320" height="8" fill="#dcfce7"/>
<text x="216.0" y="609" text-anchor="middle" class="node-title" fill="#15803d">noul</text>
<text x="68" y="638" class="mono" font-family="Consolas,monospace">noul: 0.93</text>
<rect x="392" y="590" width="320" height="88" rx="8" fill="#fff" stroke="#fcd34d"/>
<rect x="392" y="590" width="320" height="26" rx="8" fill="#fef3c7"/>
<rect x="392" y="608" width="320" height="8" fill="#fef3c7"/>
<text x="552.0" y="609" text-anchor="middle" class="node-title" fill="#b45309">choice</text>
<text x="404" y="638" class="mono" font-family="Consolas,monospace">choice: billing   confidence: 0.61</text>
<text x="404" y="654" class="mono" font-family="Consolas,monospace">probabilities: {billing: 0.84, ...}</text>
<rect x="728" y="590" width="316" height="88" rx="8" fill="#fff" stroke="#c4b5fd"/>
<rect x="728" y="590" width="316" height="26" rx="8" fill="#f5f3ff"/>
<rect x="728" y="608" width="316" height="8" fill="#f5f3ff"/>
<text x="886.0" y="609" text-anchor="middle" class="node-title" fill="#6d28d9">score</text>
<text x="740" y="638" class="mono" font-family="Consolas,monospace">score: 1.30   confidence: 0.54</text>
<text x="740" y="654" class="mono" font-family="Consolas,monospace">probabilities: {0: 0.00, 1: 0.70, 2: 0.30}</text>
<rect x="40" y="708" width="1020" height="68" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<rect x="56" y="722" width="148" height="24" rx="12" fill="#15803d"/>
<text x="130.0" y="738" text-anchor="middle" class="badge-text">LATENCY PATH</text>
<text x="220" y="739" class="node-text">Phases 2-3, in scope. Wrap costs N generates. Native heads score every question in one forward pass.</text>
</svg>
