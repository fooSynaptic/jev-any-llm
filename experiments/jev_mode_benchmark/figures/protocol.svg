<rect x="600" y="436" width="500" height="26" rx="10" fill="#16a34a"/>
<rect x="600" y="450" width="500" height="12" fill="#16a34a"/>
<text x="850.0" y="454" text-anchor="middle" class="badge-text">STAGE D</text>
<text x="614" y="482" class="node-title">Task / type / head follow-ups</text>
<text x="614" y="502" class="node-text">20NG peak L24, SST Noul/Score L16</text>
<text x="614" y="518" class="node-text">Mean pooling beats last token</text>
<text x="614" y="534" class="node-text">MLP-512 moves the peak to L32</text>
<text x="614" y="550" class="node-text">Soft prefix loses at the L8 knee</text>
<text x="614" y="566" class="node-text">Pick exit layer per task on a probe</text>
