<text x="614" y="292" class="node-title">Compiled early-exit (scheme 6)</text>
<text x="614" y="312" class="node-text">Freeze backbone, mean-pool prompt</text>
<text x="614" y="328" class="node-text">Linear Choice head on 8k labels</text>
<text x="614" y="344" class="node-text">Temperature on 2k held-out rows</text>
<text x="614" y="360" class="node-text">Sweep layers 1-32; AG News knee = L8</text>
<text x="614" y="376" class="node-text">91.73% / 12.04 ms / ECE 1.14%</text>
