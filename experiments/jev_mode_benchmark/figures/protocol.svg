<text x="54" y="482" class="node-title">Zero-train gap closing</text>
<text x="54" y="502" class="node-text">Length-normalised full label words</text>
<text x="54" y="518" class="node-text">84.17% / ECE 3.55%</text>
<text x="54" y="534" class="node-text">Shared-prefill KV batch 110.03 ms</text>
<text x="54" y="550" class="node-text">Skip calibration, ensemble, rationale</text>
<text x="54" y="566" class="node-text">Verbalizer wording is a lock</text>
