<rect x="280" y="626" width="580" height="26" rx="10" fill="#334155"/>
<rect x="280" y="640" width="580" height="12" fill="#334155"/>
<text x="570" y="644" text-anchor="middle" class="badge-text">SHIP</text>
<text x="300" y="672" class="node-title">Two production tiers from this protocol</text>
<text x="300" y="692" class="node-text">Wrap: spelled-out labels, isolated batching, optional KV multi-token score.</text>
<text x="300" y="708" class="node-text">Compiled: mean-pool, linear head, per-task exit layer on a labelled probe.</text>
