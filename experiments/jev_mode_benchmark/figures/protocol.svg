<text x="54" y="292" class="node-title">Zero-training wrap (schemes 1-5)</text>
<text x="54" y="312" class="node-text">1 generate+logprob  80.40% / 49.31 ms</text>
<text x="54" y="328" class="node-text">2 packed questions  rejected (60.33%, coupled)</text>
<text x="54" y="344" class="node-text">3 multi-bit codebook  rejected (22.95%)</text>
<text x="54" y="360" class="node-text">4 last-token logits  80.53% / 44.51 ms</text>
<text x="54" y="376" class="node-text">5 bidirectional mask  &lt;0.4 pp vs causal</text>
