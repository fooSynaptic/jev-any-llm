<text x="502.00" y="370" text-anchor="middle" class="axis">100</text>
<rect x="560" y="82" width="500" height="324" rx="10" fill="#fff" stroke="#e2e8f0"/>
<text x="580" y="114" class="panel-title">Batch-1 p50 latency (ms, log scale, lower is better)</text>
<text x="580" y="166" class="label">Vanilla AR, 13 tokens</text>
<rect x="750" y="152" width="272" height="20" rx="5" fill="#f1f5f9"/>
<rect x="750" y="152" width="245.57" height="20" rx="5" fill="#0f172a"/>
<text x="1032" y="166" class="value">511.05 ms</text>
