<text x="284.40" y="370" text-anchor="middle" class="axis">20</text>
<line x1="338.80" y1="346" x2="338.80" y2="354" stroke="#94a3b8"/>
<text x="338.80" y="370" text-anchor="middle" class="axis">40</text>
<line x1="393.20" y1="346" x2="393.20" y2="354" stroke="#94a3b8"/>
